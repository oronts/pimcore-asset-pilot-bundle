name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: '8.4'
          extensions: ctype, gd, iconv, intl, mbstring, pdo_mysql, redis, xml, zip
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: assets/studio/package-lock.json

      - name: Verify version consistency
        run: php tools/verify-version-consistency.php "${GITHUB_REF_NAME}"

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHP quality gates
        run: composer ci

      - name: Install frontend dependencies
        run: npm ci --prefix assets/studio

      - name: Audit frontend dependencies
        run: npm audit --prefix assets/studio --audit-level=low

      - name: Lint frontend
        run: npm --prefix assets/studio run lint

      - name: Check frontend types
        run: npm --prefix assets/studio run check-types

      - name: Run frontend tests
        run: npm --prefix assets/studio test

      - name: Run frontend accessibility tests
        run: npm --prefix assets/studio run test:a11y

      - name: Verify shipped frontend build
        run: npm --prefix assets/studio run verify-build

      - name: Build release frontend
        run: npm --prefix assets/studio run build

      - name: Prepare release frontend
        run: npm --prefix assets/studio run prepare-release-build

      - name: Verify release frontend
        run: npm --prefix assets/studio run verify-build

      - name: Build release archive
        run: composer archive --format=zip --file="asset-pilot-bundle-${GITHUB_REF_NAME}"

      - name: Verify release archive
        run: php tools/verify-release-archive.php "asset-pilot-bundle-${GITHUB_REF_NAME}.zip"

      - name: Preserve verified release archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-archive
          path: asset-pilot-bundle-${{ github.ref_name }}.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Download verified release archive
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-archive
          path: .

      - name: Verify release archive
        run: php tools/verify-release-archive.php "asset-pilot-bundle-${GITHUB_REF_NAME}.zip"

      - name: Generate checksum
        run: sha256sum "asset-pilot-bundle-${GITHUB_REF_NAME}.zip" > "asset-pilot-bundle-${GITHUB_REF_NAME}.zip.sha256"

      - name: Attest release archive
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: asset-pilot-bundle-${{ github.ref_name }}.zip

      - name: Generate dependency inventories
        run: |
          composer licenses --locked --no-dev --format=json > php-dependency-licenses.json
          npm sbom --prefix assets/studio --package-lock-only --omit=dev --sbom-format=cyclonedx > frontend-sbom.cdx.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          generate_release_notes: true
          files: |
            asset-pilot-bundle-${{ github.ref_name }}.zip
            asset-pilot-bundle-${{ github.ref_name }}.zip.sha256
            frontend-sbom.cdx.json
            php-dependency-licenses.json

      - name: Update Packagist
        run: |
          curl --fail-with-body --show-error --silent --retry 3 -X POST \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: oronts-asset-pilot-bundle-release (mailto:office@oronts.com)' \
            -H 'Authorization: Bearer ${{ secrets.PACKAGIST_USERNAME }}:${{ secrets.PACKAGIST_TOKEN }}' \
            'https://packagist.org/api/update-package' \
            -d '{"repository":"https://github.com/oronts/pimcore-asset-pilot-bundle"}'
