name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php:
    name: PHP 8.4
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: '8.4'
          extensions: ctype, gd, iconv, intl, mbstring, pdo_mysql, redis, xml, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Audit production dependencies
        run: composer audit --locked --no-dev

      - name: Check coding standards
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --using-cache=no

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --do-not-cache-result

  studio:
    name: Studio UI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: assets/studio/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix assets/studio

      - name: Audit frontend dependencies
        run: npm audit --prefix assets/studio --audit-level=low

      - name: Lint frontend
        run: npm --prefix assets/studio run lint

      - name: Check frontend types
        run: npm --prefix assets/studio run check-types

      - name: Run frontend tests
        run: npm --prefix assets/studio test

      - name: Run frontend accessibility tests
        run: npm --prefix assets/studio run test:a11y

      - name: Verify shipped frontend build
        run: npm --prefix assets/studio run verify-build

      - name: Build package frontend
        run: npm --prefix assets/studio run build

      - name: Prepare release frontend
        run: npm --prefix assets/studio run prepare-release-build

      - name: Verify package frontend
        run: npm --prefix assets/studio run verify-build

      - name: Preserve verified package frontend
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: package-frontend
          path: public/studio/build
          if-no-files-found: error
          retention-days: 1

  package:
    name: Composer package
    runs-on: ubuntu-latest
    needs: [php, studio]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Download verified package frontend
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: package-frontend
          path: public/studio/build

      - name: Verify package frontend
        run: npm --prefix assets/studio run verify-build

      - name: Build Composer archive
        run: composer archive --format=zip --dir=/tmp --file=asset-pilot-bundle

      - name: Verify release archive
        run: php tools/verify-release-archive.php /tmp/asset-pilot-bundle.zip
